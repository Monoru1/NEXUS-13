<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
  <rect width="640" height="360" fill="#060607"/>
  <!-- Grain texture via noise pattern -->
  <filter id="grain">
    <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" stitchTiles="stitch"/>
    <feColorMatrix type="saturate" values="0"/>
    <feBlend in="SourceGraphic" mode="multiply" result="blend"/>
    <feComposite in="blend" in2="SourceGraphic" operator="in"/>
  </filter>
  <!-- Grid lines -->
  <line x1="0" y1="90" x2="640" y2="90" stroke="#1a1a1e" stroke-width="1"/>
  <line x1="0" y1="180" x2="640" y2="180" stroke="#1a1a1e" stroke-width="1"/>
  <line x1="0" y1="270" x2="640" y2="270" stroke="#1a1a1e" stroke-width="1"/>
  <line x1="160" y1="0" x2="160" y2="360" stroke="#1a1a1e" stroke-width="1"/>
  <line x1="320" y1="0" x2="320" y2="360" stroke="#1a1a1e" stroke-width="1"/>
  <line x1="480" y1="0" x2="480" y2="360" stroke="#1a1a1e" stroke-width="1"/>
  <!-- Subject silhouette -->
  <ellipse cx="320" cy="120" rx="38" ry="44" fill="#1e1e22" stroke="#2e2e35" stroke-width="1"/>
  <path d="M220 360 Q320 240 420 360 Z" fill="#1a1a1e"/>
  <!-- Crosshair overlay -->
  <circle cx="320" cy="158" r="80" fill="none" stroke="#ffb020" stroke-width="0.5" opacity="0.4"/>
  <circle cx="320" cy="158" r="55" fill="none" stroke="#ffb020" stroke-width="0.5" opacity="0.3"/>
  <line x1="240" y1="158" x2="400" y2="158" stroke="#ffb020" stroke-width="0.5" opacity="0.4"/>
  <line x1="320" y1="78" x2="320" y2="238" stroke="#ffb020" stroke-width="0.5" opacity="0.4"/>
  <!-- Tick marks -->
  <line x1="320" y1="78" x2="320" y2="88" stroke="#ffb020" stroke-width="1" opacity="0.6"/>
  <line x1="320" y1="228" x2="320" y2="238" stroke="#ffb020" stroke-width="1" opacity="0.6"/>
  <line x1="240" y1="158" x2="250" y2="158" stroke="#ffb020" stroke-width="1" opacity="0.6"/>
  <line x1="390" y1="158" x2="400" y2="158" stroke="#ffb020" stroke-width="1" opacity="0.6"/>
  <!-- Corner brackets -->
  <path d="M20 20 L20 50 M20 20 L50 20" stroke="#ffb020" stroke-width="1" fill="none" opacity="0.5"/>
  <path d="M620 20 L620 50 M620 20 L590 20" stroke="#ffb020" stroke-width="1" fill="none" opacity="0.5"/>
  <path d="M20 340 L20 310 M20 340 L50 340" stroke="#ffb020" stroke-width="1" fill="none" opacity="0.5"/>
  <path d="M620 340 L620 310 M620 340 L590 340" stroke="#ffb020" stroke-width="1" fill="none" opacity="0.5"/>
  <!-- Classification banner -->
  <rect x="0" y="0" width="640" height="20" fill="#060607"/>
  <text x="320" y="14" font-family="monospace" font-size="9" fill="#ffb020" text-anchor="middle" letter-spacing="3">SECRET // NEXUS-13 // SURVEILLANCE LOG</text>
  <rect x="0" y="340" width="640" height="20" fill="#060607"/>
  <!-- Timestamp -->
  <text x="20" y="354" font-family="monospace" font-size="8" fill="#56565a">2024-09-14T03:14:22Z</text>
  <text x="620" y="354" font-family="monospace" font-size="8" fill="#56565a" text-anchor="end">N13-001 · ARIADNE</text>
  <!-- Metadata HUD -->
  <text x="20" y="38" font-family="monospace" font-size="8" fill="#56565a">LOC: 48.8566°N 2.3522°E</text>
  <text x="20" y="50" font-family="monospace" font-size="8" fill="#56565a">CAM: FIXED-OPTICAL-04</text>
  <text x="620" y="38" font-family="monospace" font-size="8" fill="#56565a" text-anchor="end">CONF: 94.2%</text>
  <text x="620" y="50" font-family="monospace" font-size="8" fill="#56565a" text-anchor="end">MATCH: FACIAL-BIOMETRIC</text>
  <!-- Scanline overlay -->
  <rect width="640" height="360" fill="url(#scanlines)" opacity="0.08"/>
  <defs>
    <pattern id="scanlines" width="1" height="4" patternUnits="userSpaceOnUse">
      <rect width="1" height="1" y="3" fill="white"/>
    </pattern>
  </defs>
</svg>
