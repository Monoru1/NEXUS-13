<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
  <rect width="640" height="360" fill="#060607"/>
  <!-- Grid -->
  <defs>
    <pattern id="grid" width="40" height="30" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 30" fill="none" stroke="#1a1a1e" stroke-width="0.5"/>
    </pattern>
  </defs>
  <rect width="640" height="360" fill="url(#grid)"/>
  <!-- Axis labels -->
  <text x="320" y="350" font-family="monospace" font-size="8" fill="#56565a" text-anchor="middle" letter-spacing="2">FREQUENCY (MHz)</text>
  <text x="12" y="185" font-family="monospace" font-size="8" fill="#56565a" text-anchor="middle" transform="rotate(-90 12 185)">AMPLITUDE (dB)</text>
  <!-- Frequency labels -->
  <text x="80" y="328" font-family="monospace" font-size="7" fill="#2e2e35" text-anchor="middle">10.0</text>
  <text x="180" y="328" font-family="monospace" font-size="7" fill="#2e2e35" text-anchor="middle">15.0</text>
  <text x="280" y="328" font-family="monospace" font-size="7" fill="#2e2e35" text-anchor="middle">17.3</text>
  <text x="380" y="328" font-family="monospace" font-size="7" fill="#2e2e35" text-anchor="middle">25.0</text>
  <text x="480" y="328" font-family="monospace" font-size="7" fill="#2e2e35" text-anchor="middle">35.0</text>
  <text x="580" y="328" font-family="monospace" font-size="7" fill="#2e2e35" text-anchor="middle">44.6</text>
  <!-- Normal noise floor -->
  <path d="M 40 290 Q 80 285 120 288 Q 160 292 200 286 Q 240 290 280 287 Q 320 291 360 289 Q 400 285 440 290 Q 480 288 520 286 Q 560 290 600 288"
    fill="none" stroke="#5bc0eb" stroke-width="1" opacity="0.4"/>
  <!-- Spectrum bars — normal signals -->
  <rect x="76" y="240" width="8" height="50" fill="#5bc0eb" opacity="0.25"/>
  <rect x="116" y="260" width="8" height="30" fill="#5bc0eb" opacity="0.2"/>
  <rect x="156" y="250" width="8" height="40" fill="#5bc0eb" opacity="0.2"/>
  <rect x="196" y="265" width="8" height="25" fill="#5bc0eb" opacity="0.2"/>
  <rect x="236" y="255" width="8" height="35" fill="#5bc0eb" opacity="0.2"/>
  <!-- Anomaly at 17.3 MHz -->
  <rect x="273" y="80" width="14" height="210" fill="#5bc0eb" opacity="0.7"/>
  <rect x="271" y="75" width="18" height="215" fill="none" stroke="#ffb020" stroke-width="1.5"/>
  <!-- Anomaly glow -->
  <rect x="265" y="70" width="30" height="225" fill="#5bc0eb" opacity="0.08"/>
  <!-- Annotation -->
  <line x1="283" y1="80" x2="340" y2="40" stroke="#ffb020" stroke-width="0.8" opacity="0.8"/>
  <text x="342" y="36" font-family="monospace" font-size="8" fill="#ffb020" letter-spacing="1">17.3 MHz — UNREGISTERED</text>
  <text x="342" y="48" font-family="monospace" font-size="7" fill="#ffb020" opacity="0.7">AMPLITUDE: +42dB ABOVE NOISE</text>
  <!-- Normal spectrum continues -->
  <rect x="356" y="268" width="8" height="22" fill="#5bc0eb" opacity="0.2"/>
  <rect x="396" y="255" width="8" height="35" fill="#5bc0eb" opacity="0.2"/>
  <rect x="436" y="262" width="8" height="28" fill="#5bc0eb" opacity="0.2"/>
  <rect x="476" y="258" width="8" height="32" fill="#5bc0eb" opacity="0.2"/>
  <rect x="516" y="270" width="8" height="20" fill="#5bc0eb" opacity="0.2"/>
  <rect x="556" y="265" width="8" height="25" fill="#5bc0eb" opacity="0.2"/>
  <!-- Baseline -->
  <line x1="40" y1="290" x2="600" y2="290" stroke="#2e2e35" stroke-width="1"/>
  <!-- Header -->
  <rect x="0" y="0" width="640" height="20" fill="#060607"/>
  <text x="320" y="14" font-family="monospace" font-size="9" fill="#5bc0eb" text-anchor="middle" letter-spacing="2">SECRET // VESPER · SIGNAL INTERCEPT · SPECTRUM ANALYSIS</text>
  <!-- Timestamp -->
  <text x="40" y="316" font-family="monospace" font-size="7" fill="#56565a">CAPTURED: 2021-03-08T22:41:09Z</text>
  <text x="600" y="316" font-family="monospace" font-size="7" fill="#56565a" text-anchor="end">SITE: NORTH ARRAY · OPERATOR: AUTO</text>
  <!-- Scanlines -->
  <rect width="640" height="360" fill="url(#scanl)" opacity="0.05"/>
  <defs>
    <pattern id="scanl" width="1" height="4" patternUnits="userSpaceOnUse">
      <rect width="1" height="1" y="3" fill="white"/>
    </pattern>
  </defs>
</svg>
