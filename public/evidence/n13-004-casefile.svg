  <text x="62" y="208" font-family="monospace" font-size="8" fill="#a0a0a4">Operator ID: [NULL] · Terminal: UNREGISTERED · Auth: BYPASSED</text>
  <text x="62" y="222" font-family="monospace" font-size="8" fill="#56565a">No authorising officer logged. Session origin: UNKNOWN.</text>
