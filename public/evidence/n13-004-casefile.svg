  <rect x="50" y="162" width="540" height="72" fill="#ffb02008" stroke="#ffb020" stroke-width="0.5"/>
  <text x="62" y="178" font-family="monospace" font-size="8" fill="#ffb020" letter-spacing="1">!! AUDIT LOG ANOMALY — DETECTED 2024-08-14</text>
