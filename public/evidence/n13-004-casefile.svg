  <line x1="50" y1="242" x2="590" y2="242" stroke="#1a1a1e" stroke-width="1"/>
  <text x="50" y="258" font-family="monospace" font-size="8" fill="#a0a0a4">EVIDENCE ON FILE: 23 ITEMS</text>
