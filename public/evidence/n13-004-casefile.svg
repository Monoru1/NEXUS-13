  <text x="50" y="130" font-family="monospace" font-size="8" fill="#8a8a86">following conclusion of Operation LOOKING GLASS. All</text>
  <text x="50" y="144" font-family="monospace" font-size="8" fill="#8a8a86">surveillance assets redeployed. Case sealed per directive.</text>
  <line x1="50" y1="154" x2="590" y2="154" stroke="#1a1a1e" stroke-width="1"/>
